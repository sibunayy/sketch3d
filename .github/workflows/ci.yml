name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Speed check: prints the numbers and flags a slow build, but never blocks a merge
      # (shared CI machines vary too much for a hard failure). Real devices are in docs/release-checklist.md.
      - run: npm run bench
        continue-on-error: true
